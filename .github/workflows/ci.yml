name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel earlier in-flight runs for the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  Phase 0+: configure + Debug build + run unit tests on a Windows runner.
  #  Requires MSVC on PATH (Ninja Multi-Config + cl).
  # ---------------------------------------------------------------------------
  windows-debug:
    name: windows / debug
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Ninja Multi-Config needs cl/link/lib on PATH; default GHA shell does not
      # load the Visual Studio developer environment.
      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The GP SDK isn't on the runner; clone it next to our source tree and
      # pass its path to CMake explicitly via -DGP_SDK_DIR=...
      # GP 5 requires SDK v62+ (beta-sdk-v62). main @ v47 fails "extension too old".
      - name: Clone Gig Performer SDK (v62)
        run: git clone --depth 1 --branch beta-sdk-v62 https://github.com/gigperformer/gp-sdk ${{ github.workspace }}/.gp-sdk
        shell: pwsh

      - name: Configure
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DGP_SDK_DIR="${{ github.workspace }}/.gp-sdk" `
            -DPSL_WARNINGS_AS_ERRORS=ON
        shell: pwsh

      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel
        shell: pwsh

      - name: Test (Debug)
        run: ctest --test-dir build -C Debug --output-on-failure
        shell: pwsh

      - name: Stage DLL for upload
        if: success()
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item build/bin/Debug/PreSonusStudioLive.dll artifacts/
        shell: pwsh

      - name: Upload PreSonusStudioLive.dll (debug)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: PreSonusStudioLive-debug
          path: artifacts/PreSonusStudioLive.dll
          retention-days: 14
